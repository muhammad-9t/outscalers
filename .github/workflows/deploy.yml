name: 🚀 Deploy Outscalers Website

# Deploys the Next.js site at /var/www/outscalers-testing (port 3004 → https://outscalers.com).
# Does NOT touch the old Nuxt site (outscalers.service / port 3003).
# Adapted from Outscalersdev/crm-outscalers deploy workflow (appleboy/ssh-action).

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-outscalers-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/var/www/outscalers-testing

            echo "=== Updating repository ==="
            cd "$APP_DIR"

            # Ensure git trusts this directory when pulled as root
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Outscalersdev/outscalers-testing.git

            echo "Fetching latest master..."
            git fetch --prune origin master
            git checkout master
            git reset --hard origin/master

            # Drop embedded token from remote URL after pull
            git remote set-url origin https://github.com/Outscalersdev/outscalers-testing.git

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Notify Slack on Success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sS -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"✅ Deployment successful for ${{ github.repository }}@${{ github.sha }} → https://outscalers.com/\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi

      - name: Notify Slack on Failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sS -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"❌ Deployment FAILED for ${{ github.repository }}@${{ github.sha }} — old site on :3003 was not touched.\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
