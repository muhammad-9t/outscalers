name: 🚀 Deploy Outscalers Website

# Deploys the Next.js site at /var/www/outscalers-testing (port 3004 → https://outscalers.com).
# Does NOT touch the old Nuxt site (outscalers.service / port 3003).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-outscalers-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/var/www/outscalers-testing

            echo "=== Updating repository ==="
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # Fetch with the job-scoped GitHub token. Do not store it in origin.
            git fetch --prune "https://x-access-token:${{ github.token }}@github.com/Outscalersdev/outscalers-testing.git" master
            git checkout -B master FETCH_HEAD
            git reset --hard FETCH_HEAD
            git remote set-url origin https://github.com/Outscalersdev/outscalers-testing.git

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Notify Slack on Success
        if: success()
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"✅ Deployment successful for ${{ github.repository }} on branch ${{ github.ref_name }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack on Failure
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"❌ Deployment FAILED for ${{ github.repository }} on branch ${{ github.ref_name }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
