name: 🚀 Deploy Outscalers Website

# Deploys the Next.js site at /var/www/outscalers-testing (port 3004 → https://outscalers.com).
# Does NOT touch the old Nuxt site (outscalers.service / port 3003).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-outscalers-website
  cancel-in-progress: false

jobs:
  # Gate: the same checks as local development. If any fails, nothing is deployed.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits (tags can be moved); the comment shows the version
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install (exact lockfile versions)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

      - name: Notify Slack on failed checks
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"⛔ Checks FAILED for ${{ github.repository }} on ${{ github.ref_name }} by ${{ github.actor }}. Nothing was deployed.\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/var/www/outscalers-testing

            echo "=== Updating repository ==="
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # Fetch with the job-scoped GitHub token. Do not store it in origin.
            git fetch --prune "https://x-access-token:${{ github.token }}@github.com/Outscalersdev/outscalers-testing.git" master
            git checkout -B master FETCH_HEAD
            git reset --hard FETCH_HEAD
            git remote set-url origin https://github.com/Outscalersdev/outscalers-testing.git

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Notify Slack on Success
        if: success()
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"✅ Deployment successful for ${{ github.repository }} on branch ${{ github.ref_name }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack on Failure
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"❌ Deployment FAILED for ${{ github.repository }} on branch ${{ github.ref_name }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
